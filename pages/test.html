<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Test — Security+ Acronym Arcade</title>
  <meta name="theme-color" content="#dc2626" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2222%22>⚡</text></svg>" />
  <link rel="stylesheet" href="../css/styles.css" />
  <!-- Stamps the saved light/dark choice on <html> BEFORE the first paint.
       Synchronous and in the head on purpose: deferred, it becomes a
       white flash in the face of somebody with light sensitivity. -->
  <script src="../js/theme.js"></script>
</head>
<body data-depth="1">
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>

    <div class="game-header">
      <div class="game-title">
        <span class="tile-icon" style="background:linear-gradient(150deg,#fb923c,#dc2626); color:#fff;" id="mode-icon"></span>
        <h1>Test</h1>
      </div>
      <div class="hud">
        <div class="hud-stat"><span id="hud-label">Question</span><span id="hud-index">1 / 15</span></div>
        <div class="hud-stat"><span>Score</span><span id="hud-score">0</span></div>
      </div>
    </div>

    <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>

    <main class="card-stage" id="game-area">
      <div class="quiz-card">
        <div class="quiz-prompt-label">What does this acronym stand for?</div>
        <div class="quiz-prompt" id="quiz-acronym">AAA</div>
        <p class="review-note" id="review-note" role="status" hidden></p>
        <div class="quiz-options" id="quiz-options"></div>
      </div>
      <div class="test-nav">
        <button class="btn btn-ghost" id="back-btn" hidden>&larr; Back</button>
        <button class="btn btn-primary" id="next-btn" hidden>Next question &rarr;</button>
      </div>
    </main>

    <div class="results-card" id="results" hidden>
      <span class="tile-icon" style="background:linear-gradient(150deg,#fb923c,#dc2626); color:#fff; margin:0 auto;" id="results-icon"></span>
      <h2>Test complete!</h2>
      <div class="big-score" id="res-score">0 / 15</div>
      <div class="results-stats">
        <div><div class="num" id="res-pct">0%</div><div class="lab">Accuracy</div></div>
        <div><div class="num" id="res-best">0%</div><div class="lab">Best</div></div>
      </div>
      <div id="review-list" style="text-align:left; margin-top:14px;"></div>
      <div class="results-actions">
        <button class="btn btn-primary" id="play-again-btn">Take again</button>
        <a class="btn btn-ghost" href="../index.html">Dashboard</a>
      </div>
    </div>

    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <script src="../js/acronyms-data.js"></script>
  <script src="../js/common.js"></script>
  <script>
    renderTopbar();
    renderFooter("site-footer");
    document.getElementById("mode-icon").innerHTML = ICONS.flame;
    document.getElementById("results-icon").innerHTML = ICONS.trophy;

    const QUESTION_COUNT = 15;
    const OPTION_COUNT = 4;

    const gameArea = document.getElementById("game-area");
    const resultsEl = document.getElementById("results");
    const acronymEl = document.getElementById("quiz-acronym");
    const optionsEl = document.getElementById("quiz-options");
    const hudIndex = document.getElementById("hud-index");
    const hudScore = document.getElementById("hud-score");
    const progressFill = document.getElementById("progress-fill");
    const nextBtn = document.getElementById("next-btn");
    const backBtn = document.getElementById("back-btn");
    const hudLabel = document.getElementById("hud-label");
    const reviewNote = document.getElementById("review-note");

    /* qIndex: the question the student is up to. view: the one on screen, which Back can take to an earlier one.
       picks[i]: the option chosen for question i. An earlier question comes back as it was answered and stays
       locked: its right answer has already been shown, so changing the pick would only change the score. */
    let questions, qIndex, view, score, missed, picks;

    /* No acronym from the student's last three tests is asked in a new one. Remembered in this browser (localStorage), under
       a key of this site's own: the acronym sites all live at one web address, so they share the browser's storage. A
       private window or blocked storage only means nothing is remembered; the test still runs. */
    const HISTORY_KEY = "security-acronyms:test-history", HISTORY_TESTS = 3;
    function readHistory() {
      try { const h = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); return Array.isArray(h) ? h.filter(Array.isArray).slice(-HISTORY_TESTS) : []; }
      catch (e) { return []; }
    }
    function saveHistory(h) {
      try { localStorage.setItem(HISTORY_KEY, JSON.stringify(h.slice(-HISTORY_TESTS))); } catch (e) { /* no storage: nothing remembered */ }
    }

    /* a wrong option is never the right answer in other words: not another meaning of the same acronym (STP, MAC), not a
       definition two acronyms share, and no two options read the same */
    function pickWrongOptions(item, count) {
      const out = [], seen = new Set([item.definition]);
      for (const x of shuffleArray(ACRONYMS)) {
        if (out.length === count) break;
        if (x.acronym === item.acronym || seen.has(x.definition)) continue;
        seen.add(x.definition);
        out.push(x);
      }
      return out;
    }

    function buildQuestions() {
      const history = readHistory(), recent = new Set(history.flat()), want = Math.min(QUESTION_COUNT, ACRONYMS.length);
      let picked = sampleArray(ACRONYMS.filter((a) => !recent.has(a.id)), want);
      /* a list too short to leave three whole tests out: top up from the test taken longest ago first */
      for (let k = 0; picked.length < want && k < history.length; k++) {
        const have = new Set(picked.map((a) => a.id));
        picked = picked.concat(shuffleArray(ACRONYMS.filter((a) => history[k].indexOf(a.id) >= 0 && !have.has(a.id))).slice(0, want - picked.length));
      }
      saveHistory(history.concat([picked.map((a) => a.id)]));
      return picked.map((item) => ({ item, options: shuffleArray([item, ...pickWrongOptions(item, OPTION_COUNT - 1)]) }));
    }

    function startQuiz() {
      questions = buildQuestions();
      qIndex = 0;
      view = 0;
      score = 0;
      missed = [];
      picks = [];
      resultsEl.hidden = true;
      gameArea.hidden = false;
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[view], pick = picks[view], reviewing = view < qIndex;
      acronymEl.textContent = q.item.acronym;
      hudLabel.textContent = reviewing ? "Reviewing" : "Question";
      hudIndex.textContent = `${view + 1} / ${questions.length}`;
      hudScore.textContent = score;
      progressFill.style.width = `${(qIndex / questions.length) * 100}%`;
      reviewNote.hidden = !reviewing;
      reviewNote.textContent = reviewing ? `Looking back at question ${view + 1}. Your answer is locked: the right answer was already shown.` : "";
      optionsEl.innerHTML = "";
      q.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.className = "quiz-option";
        btn.textContent = opt.definition;
        btn.addEventListener("click", () => selectOption(opt));
        optionsEl.appendChild(btn);
        if (pick === undefined) return;
        btn.disabled = true;
        /* marked three ways: the colour, the rule down its left edge, and the words */
        const mine = opt.id === pick, right = opt.id === q.item.id;
        if (!mine && !right) return;
        btn.classList.add(right ? "correct" : "wrong");
        const word = document.createElement("span");
        word.className = "mark-word";
        word.textContent = right ? (mine ? "✓ Your answer: correct" : "✓ The correct answer") : "✗ Your answer: wrong";
        btn.appendChild(word);
      });
      backBtn.hidden = view === 0;
      nextBtn.hidden = pick === undefined;
    }

    function selectOption(opt) {
      if (view !== qIndex || picks[view] !== undefined) return;
      const q = questions[view];
      picks[view] = opt.id;
      if (opt.id === q.item.id) score++;
      else missed.push(q.item);
      renderQuestion();
      nextBtn.focus();
    }

    function nextQuestion() {
      if (view < qIndex) { view++; renderQuestion(); (nextBtn.hidden ? optionsEl.firstChild : nextBtn).focus(); return; }
      qIndex++;
      view = qIndex;
      if (qIndex >= questions.length) finishQuiz();
      else renderQuestion();
    }

    function backQuestion() {
      if (view === 0) return;
      view--;
      renderQuestion();
      (backBtn.hidden ? nextBtn : backBtn).focus();
    }

    function finishQuiz() {
      progressFill.style.width = "100%";
      gameArea.hidden = true;
      resultsEl.hidden = false;
      const pct = Math.round((score / questions.length) * 100);
      document.getElementById("res-score").textContent = `${score} / ${questions.length}`;
      document.getElementById("res-pct").textContent = `${pct}%`;
      const improved = Scores.setBestIfBetter("test-pct", pct, true);
      document.getElementById("res-best").textContent = `${Scores.getBest("test-pct")}%`;
      if (improved) showToast("New best score!");

      const reviewEl = document.getElementById("review-list");
      if (missed.length) {
        reviewEl.innerHTML =
          `<p class="center-note" style="text-align:center;">Review these:</p>` +
          missed
            .map(
              (m) =>
                `<p style="font-size:0.85rem; margin:6px 0;"><strong>${m.acronym}</strong> — ${m.expansion}</p>`
            )
            .join("");
      } else {
        reviewEl.innerHTML = `<p class="center-note" style="text-align:center;">Perfect score — nice work!</p>`;
      }
    }

    nextBtn.addEventListener("click", nextQuestion);
    backBtn.addEventListener("click", backQuestion);
    document.getElementById("play-again-btn").addEventListener("click", startQuiz);

    startQuiz();
  </script>
</body>
</html>
